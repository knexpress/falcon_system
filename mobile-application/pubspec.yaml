name: falcon_revive
description: Falcon Revive garage ERP mobile app — same API as the web desk.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  lottie: ^3.1.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  provider: ^6.1.2
  pdfx: ^2.8.0
  flutter_local_notifications: ^18.0.1
  flutter_background_service: ^5.1.0
  flutter_background_service_android: ^6.3.0
  permission_handler: ^11.3.1
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/falcon_revive_emblem.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/falcon_revive_emblem.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/falcon_revive_emblem.png
    - assets/falcon.json
